<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>برنامه هفتگی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        /* ===== Design tokens ===== */
        :root {
            --bg: #f6f4f1;
            --surface: #fff;
            --text: #33383b;
            --muted: #8b9094;
            --accent: #86a79b;
            --accent-strong: #4d6d63;
            --accent-soft: #eaf0ed;
            --border: #ece8e2;
            --today: #f3e1d5;
            --friday-tint: #fbf8f5;
            --danger: #b5655a;
            --font: "IRANYekan", "Iran Yekan", "Vazirmatn", Tahoma, sans-serif;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light;
        };

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1b1d1f;
                --surface: #242729;
                --text: #e9e7e4;
                --muted: #9ba0a5;
                --accent: #86a89c;
                --accent-strong: #a9cbbf;
                --accent-soft: #2b3633;
                --border: #33373a;
                --today: #4a3b32;
                --friday-tint: #282b2d;
                color-scheme: dark;
            }
        };

        :root[data-theme="dark"] {
            --bg: #1b1d1f;
            --surface: #242729;
            --text: #e9e7e4;
            --muted: #9ba0a5;
            --accent: #86a89c;
            --accent-strong: #a9cbbf;
            --accent-soft: #2b3633;
            --border: #33373a;
            --today: #4a3b32;
            --friday-tint: #282b2d;
            color-scheme: dark;
        };

        /* ===== Base ===== */
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        };

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        };

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.7 var(--font);
        };

        button,
        input,
        select {
            font: inherit;
            color: inherit;
        };

        button {
            cursor: pointer;
        };

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        };

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        };

        /* ===== Shared components ===== */
        .button {
            border: 0;
            border-radius: 12px;
            padding: 9px 18px;
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            transition: filter .15s;
        };

        .button:hover {
            filter: brightness(.95);
        };

        .button--soft {
            background: var(--accent-soft);
            color: var(--accent-strong);
        };

        .button--danger {
            background: transparent;
            color: var(--danger);
            padding-inline: 8px;
        };

        .icon-button {
            flex: none;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-size: 16px;
            line-height: 1;
        };

        .icon-button:hover {
            background: var(--border);
            color: var(--text);
        };

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
        };

        select,
        input[type="text"],
        input[type="time"] {
            min-width: 0;
            padding: 6px 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
        };

        /* ===== Header and quote ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        };

        .page-header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
        };

        .page-header__date {
            margin-top: 2px;
            color: var(--muted);
        };

        .page-header__actions {
            display: flex;
            gap: 8px;
            align-items: center;
        };

        .quote-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
            padding: 18px 22px;
            background: var(--accent-soft);
            border-radius: 18px;
        };

        .quote-card__text {
            margin: 0;
            font-size: 17px;
            font-weight: 500;
        };

        .quote-card__author {
            margin-top: 6px;
            color: var(--accent-strong);
            font-size: 13px;
        };

        .quote-card__original {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12.5px;
            direction: ltr;
            text-align: right;
        };

        /* ===== Layout ===== */
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            align-items: start;
        };

        @media (max-width: 820px) {
            .layout {
                grid-template-columns: 1fr;
            }
        };

        /* ===== Month calendar ===== */
        .calendar__controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        };

        .calendar__controls select {
            flex: 1;
        };

        .calendar__grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center;
        };

        .calendar__weekday {
            padding: 4px 0;
            color: var(--muted);
            font-size: 12px;
        };

        .calendar__footer {
            display: flex;
            justify-content: center;
            margin-top: 12px;
        };

        .calendar-day {
            position: relative;
            aspect-ratio: 1;
            border: 0;
            border-radius: 10px;
            background: transparent;
            font-size: 13.5px;
        };

        .calendar-day:hover {
            background: var(--accent-soft);
        };

        .calendar-day.is-friday {
            color: var(--danger);
        };

        .calendar-day.is-today {
            background: var(--today);
        };

        .calendar-day.is-selected {
            background: var(--accent);
            color: #fff;
        };

        .calendar-day.has-tasks::after {
            content: "";
            position: absolute;
            bottom: 5px;
            left: 50%;
            width: 4px;
            height: 4px;
            margin-left: -2px;
            border-radius: 50%;
            background: currentColor;
            opacity: .55;
        };

        /* ===== Week board ===== */
        .week__bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        };

        .week__title {
            flex: 1;
            min-width: 180px;
            margin: 0;
            font-size: 17px;
            font-weight: 600;
        };

        .progress {
            height: 6px;
            margin-bottom: 16px;
            overflow: hidden;
            background: var(--border);
            border-radius: 6px;
        };

        .progress__fill {
            display: block;
            width: 0;
            height: 100%;
            background: var(--accent);
            transition: width .3s;
        };

        .week__days {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        };

        .day-card {
            min-height: 150px;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
        };

        .day-card.is-friday {
            background: var(--friday-tint);
        };

        .day-card.is-today {
            border-color: var(--accent);
        };

        .day-card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        };

        .day-card__weekday {
            font-weight: 600;
        };

        .day-card__date {
            margin-inline-start: 6px;
            color: var(--muted);
            font-size: 12.5px;
        };

        .day-card__empty {
            padding: 8px 4px;
            color: var(--muted);
            font-size: 13px;
        };

        /* ===== Task row ===== */
        .task {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-radius: 10px;
        };

        .task:hover {
            background: var(--bg);
        };

        .task__title {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        };

        .task__time {
            flex: none;
            padding: 0 7px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            border-radius: 8px;
            font-size: 12px;
        };

        .task.is-done .task__title {
            color: var(--muted);
            text-decoration: line-through;
        };

        .task .icon-button {
            width: 26px;
            height: 26px;
            font-size: 13px;
            opacity: 0;
        };

        .task:hover .icon-button,
        .task:focus-within .icon-button {
            opacity: 1;
        };

        @media (hover: none) {
            .task .icon-button {
                opacity: 1;
            }
        };

        .task__checkbox {
            appearance: none;
            -webkit-appearance: none;
            display: grid;
            place-content: center;
            flex: none;
            width: 20px;
            height: 20px;
            margin: 0;
            border: 1.5px solid var(--accent);
            border-radius: 50%;
            cursor: pointer;
        };

        .task__checkbox:checked {
            background: var(--accent);
        };

        .task__checkbox:checked::after {
            content: "✓";
            color: #fff;
            font-size: 12px;
            line-height: 1;
        };

        /* ===== Task dialog ===== */
        .task-dialog {
            width: min(420px, 92vw);
            padding: 22px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
        };

        .task-dialog::backdrop {
            background: rgba(30, 32, 34, .35);
        };

        .task-dialog h3 {
            margin: 0 0 14px;
            font-weight: 600;
        };

        .task-dialog label {
            display: block;
            margin: 12px 0 4px;
            color: var(--muted);
            font-size: 13px;
        };

        .task-dialog input[type="text"] {
            width: 100%;
            padding: 10px 12px;
        };

        .field-row {
            display: flex;
            gap: 8px;
        };

        .field-row>* {
            flex: 1;
        };

        .dialog-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        };

        .dialog-actions__spacer {
            flex: 1;
        };

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        };

    </style>

</head>

<body>

    <!-- HTML Codes -->
    <div class="page">
        <header class="page-header">
            <div>
                <h1>برنامهٔ هفتگی</h1>
                <div class="page-header__date" id="today-label"></div>
            </div>
            <div class="page-header__actions">
                <button class="button button--soft" id="theme-button" data-action="toggle-theme"></button>
                <button class="button" data-action="add-task">+ کار جدید</button>
            </div>
        </header>

        <section class="quote-card" aria-live="polite">
            <div>
                <p class="quote-card__text" id="quote-text"></p>
                <div class="quote-card__author" id="quote-author"></div>
                <small class="quote-card__original" id="quote-original"></small>
            </div>
            <button class="icon-button" data-action="shuffle-quote" title="جملهٔ دیگر"
                aria-label="جملهٔ دیگر">↻</button>
        </section>

        <div class="layout">
            <aside class="card calendar">
                <div class="calendar__controls">
                    <button class="icon-button" data-action="next-month" aria-label="ماه بعد">›</button>
                    <select id="month-select" aria-label="ماه"></select>
                    <select id="year-select" aria-label="سال"></select>
                    <button class="icon-button" data-action="previous-month" aria-label="ماه قبل">‹</button>
                </div>
                <div class="calendar__grid" id="calendar-grid"></div>
                <div class="calendar__footer">
                    <button class="button button--soft" data-action="go-today">برو به امروز</button>
                </div>
            </aside>

            <main class="week">
                <div class="week__bar">
                    <h2 class="week__title" id="week-title"></h2>
                    <button class="icon-button" data-action="next-week" aria-label="هفتهٔ بعد">›</button>
                    <button class="icon-button" data-action="previous-week" aria-label="هفتهٔ قبل">‹</button>
                </div>
                <div class="progress" title="پیشرفت هفته"><i class="progress__fill" id="progress-fill"></i></div>
                <div class="week__days" id="week-days"></div>
            </main>
        </div>
    </div>

    <dialog class="task-dialog" id="task-dialog">
        <h3 id="dialog-title"></h3>
        <label for="task-title">عنوان</label>
        <input type="text" id="task-title" maxlength="120" autocomplete="off" placeholder="مثلاً: تمرین فلکس‌باکس">
        <label>تاریخ</label>
        <div class="field-row">
            <select id="task-day" aria-label="روز"></select>
            <select id="task-month" aria-label="ماه"></select>
            <select id="task-year" aria-label="سال"></select>
        </div>
        <label for="task-time">ساعت (اختیاری)</label>
        <input type="time" id="task-time" dir="ltr">
        <div class="dialog-actions">
            <button class="button" data-action="save-task">ذخیره</button>
            <button class="button button--soft" data-action="cancel-task">انصراف</button>
            <span class="dialog-actions__spacer"></span>
            <button class="button button--danger" id="dialog-delete-button"
                data-action="delete-edited-task">حذف</button>
        </div>
    </dialog>

</body>

</html>
